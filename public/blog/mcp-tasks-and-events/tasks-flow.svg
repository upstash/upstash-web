<text x="28" y="34" font-size="15.5" font-weight="650" class="ink">MCP Tasks</text><text x="28" y="54" font-size="13" class="mute">Answer now, finish later.</text><rect x="86" y="64" width="168" height="38" rx="10" class="f-host" stroke-width="1.25"/><text x="170" y="87.75" font-size="13.5" font-weight="650" text-anchor="middle" class="t-host">MCP client</text><rect x="476" y="64" width="168" height="38" rx="10" class="f-srv" stroke-width="1.25"/><text x="560" y="87.75" font-size="13.5" font-weight="650" text-anchor="middle" class="t-srv">MCP server</text><line x1="170" y1="102" x2="170" y2="446" class="life" stroke-width="1.5"/><line x1="560" y1="102" x2="560" y2="446" class="life" stroke-width="1.5"/><rect x="554" y="206" width="12" height="220" rx="3" class="act" stroke-width="1"/><text x="586" y="266" font-size="12.5" font-weight="600" class="act-t">work runs in</text><text x="586" y="282" font-size="12.5" font-weight="600" class="act-t">the background</text><path d="M176 152 L548 152" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="362" y="129.5" font-size="12.5" font-weight="500" text-anchor="middle" class="ink mono">tools/call</text><text x="362" y="144" font-size="11.5" text-anchor="middle" class="mute">the client declares the tasks extension</text><path d="M548 206 L176 206" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="362" y="183.5" font-size="12.5" font-weight="500" text-anchor="middle" class="ink mono">resultType: &quot;task&quot;</text><text x="362" y="198" font-size="11.5" text-anchor="middle" class="mute">taskId · status: working · right away</text><rect x="126" y="226" width="450" height="108" rx="6" class="frag" stroke-width="1.25"/><path d="M126 232 a6 6 0 0 1 6 -6 H294 v14 l-8 8 H126 z" class="frag-tab" stroke-width="1.25"/><text x="134" y="241" font-size="11" font-weight="600" class="mute mono">loop · every pollIntervalMs</text><path d="M176 270 L548 270" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="362" y="262" font-size="12.5" font-weight="500" text-anchor="middle" class="ink mono">tasks/get { taskId }</text><path d="M548 316 L176 316" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="362" y="293.5" font-size="12.5" font-weight="500" text-anchor="middle" class="ink mono">status: &quot;working&quot;</text><text x="362" y="308" font-size="11.5" text-anchor="middle" class="mute">&quot;Step 2/4&quot;</text><path d="M176 380 L548 380" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="362" y="372" font-size="12.5" font-weight="500" text-anchor="middle" class="ink mono">tasks/get { taskId }</text><path d="M548 426 L176 426" class="ln-hl" stroke-width="2" stroke-linejoin="round" marker-end="url(#mh)"/><text x="362" y="403.5" font-size="12.5" font-weight="650" text-anchor="middle" class="hl mono">status: &quot;completed&quot;</text><text x="362" y="418" font-size="11.5" text-anchor="middle" class="mute">+ the result</text><text x="28" y="478" font-size="12.5" class="mute">The client polls at the server's suggested interval, not the model, so a host can keep the polling out of its context.</text>
</svg>
