<svg xmlns="http://www.w3.org/2000/svg" width="760" height="504" viewBox="0 0 760 504" role="img" aria-labelledby="t d">
<title id="t">MCP Tasks: a tool call returns a task handle, the client polls tasks/get</title>
<desc id="d">Sequence diagram. The client calls a tool and declares the tasks extension. The server answers at once with a task handle (resultType task, a taskId, status working) while the work runs in the background. In a loop, every pollIntervalMs, the client calls tasks/get and sees status working with a progress message. A final tasks/get returns status completed with the result.</desc>
