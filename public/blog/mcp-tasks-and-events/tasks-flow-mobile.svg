<rect class="bg" x="0.5" y="0.5" width="359" height="573" rx="12"/>
<text x="18" y="34" font-size="15" font-weight="650" class="ink">MCP Tasks</text><text x="18" y="54" font-size="13" class="mute">Answer now, finish later.</text><rect x="8" y="78" width="128" height="38" rx="10" class="f-host" stroke-width="1.25"/><text x="72" y="101.2775" font-size="12.555000000000001" font-weight="650" text-anchor="middle" class="t-host">MCP client</text><rect x="186" y="78" width="128" height="38" rx="10" class="f-srv" stroke-width="1.25"/><text x="250" y="101.2775" font-size="12.555000000000001" font-weight="650" text-anchor="middle" class="t-srv">MCP server</text><line x1="72" y1="116" x2="72" y2="510" class="life" stroke-width="1.5"/><line x1="250" y1="116" x2="250" y2="510" class="life" stroke-width="1.5"/><rect x="244" y="236" width="12" height="254" rx="3" class="act" stroke-width="1"/><text x="269" y="288" font-size="11.5" font-weight="600" class="act-t">work runs</text><text x="269" y="303" font-size="11.5" font-weight="600" class="act-t">in the</text><text x="269" y="318" font-size="11.5" font-weight="600" class="act-t">background</text><path d="M78 172 L238 172" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="158" y="150" font-size="12" font-weight="500" text-anchor="middle" class="ink mono">tools/call</text><text x="158" y="164" font-size="11" text-anchor="middle" class="mute">declares the tasks extension</text><path d="M238 236 L78 236" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="158" y="214" font-size="12" font-weight="500" text-anchor="middle" class="ink mono">resultType: &quot;task&quot;</text><text x="158" y="228" font-size="11" text-anchor="middle" class="mute">taskId · status: working</text><rect x="42" y="262" width="220" height="124" rx="6" class="frag" stroke-width="1.25"/><path d="M42 268 a6 6 0 0 1 6 -6 H174 v14 l-8 8 H42 z" class="frag-tab" stroke-width="1.25"/><text x="50" y="277" font-size="10.5" font-weight="600" class="mute mono">loop · pollIntervalMs</text><path d="M78 316 L238 316" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="158" y="308" font-size="12" font-weight="500" text-anchor="middle" class="ink mono">tasks/get { taskId }</text><path d="M238 368 L78 368" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="158" y="346" font-size="12" font-weight="500" text-anchor="middle" class="ink mono">status: &quot;working&quot;</text><text x="158" y="360" font-size="11" text-anchor="middle" class="mute">&quot;Step 2/4&quot;</text><path d="M78 438 L238 438" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="158" y="430" font-size="12" font-weight="500" text-anchor="middle" class="ink mono">tasks/get { taskId }</text><path d="M238 490 L78 490" class="ln-hl" stroke-width="2" stroke-linejoin="round" marker-end="url(#mh)"/><text x="158" y="468" font-size="12" font-weight="650" text-anchor="middle" class="hl mono">status: &quot;completed&quot;</text><text x="158" y="482" font-size="11" text-anchor="middle" class="mute">+ the result</text><text x="18" y="540" font-size="12" class="mute">The client polls, not the model, so a host</text><text x="18" y="557" font-size="12" class="mute">can keep the polling out of the model's context.</text>
</svg>
