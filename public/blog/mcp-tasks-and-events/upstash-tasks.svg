<text x="28" y="34" font-size="15.5" font-weight="650" class="ink">@upstash/mcp-toolkit/tasks</text><text x="28" y="54" font-size="13" class="mute">The same idea as MCP Tasks, as plain tools that work in every client.</text><rect x="28" y="112" width="164" height="96" rx="10" class="f-host" stroke-width="1.25"/><text x="110" y="148" font-size="14" font-weight="650" text-anchor="middle" class="t-host">Model</text><text x="110" y="165" font-size="12" text-anchor="middle" class="s-host">any MCP client:</text><text x="110" y="182" font-size="12" text-anchor="middle" class="s-host">Claude Code, Codex, …</text><rect x="256" y="80" width="228" height="200" rx="10" class="f-srv" stroke-width="1.25"/><text x="370" y="104" font-size="14" font-weight="650" text-anchor="middle" class="t-srv">Your MCP server</text><rect x="274" y="121" width="192" height="30" rx="7" class="f-chip" stroke-width="1"/><text x="370" y="140.5" font-size="12.5" text-anchor="middle" class="t-chip mono">generate_report</text><rect x="274" y="161" width="192" height="30" rx="7" class="f-chip" stroke-width="1"/><text x="370" y="180.5" font-size="12.5" text-anchor="middle" class="t-chip mono">task_status</text><rect x="274" y="201" width="192" height="30" rx="7" class="f-chip" stroke-width="1"/><text x="370" y="220.5" font-size="12.5" text-anchor="middle" class="t-chip mono">task_cancel</text><text x="370" y="262" font-size="11.5" text-anchor="middle" class="s-srv">tools</text><rect x="580" y="96" width="228" height="104" rx="10" class="f-redis" stroke-width="1.25"/><text x="694" y="136" font-size="14" font-weight="650" text-anchor="middle" class="t-redis">Upstash Redis</text><text x="694" y="153" font-size="12" text-anchor="middle" class="s-redis">task record:</text><text x="694" y="170" font-size="12" text-anchor="middle" class="s-redis">status, progress, result</text><rect x="580" y="226" width="228" height="80" rx="10" class="f-qs" stroke-width="1.25"/><text x="694" y="262.5" font-size="14" font-weight="650" text-anchor="middle" class="t-qs">QStash / Workflow</text><text x="694" y="279.5" font-size="12" text-anchor="middle" class="s-qs">delivers the work, retries it</text><rect x="256" y="334" width="228" height="58" rx="10" class="f-srv" stroke-width="1.25"/><text x="370" y="358.75" font-size="13.5" font-weight="650" text-anchor="middle" class="t-srv mono">/api/execute</text><text x="370" y="376.75" font-size="12" text-anchor="middle" class="s-srv">runs your handler</text><path d="M192 136 L270 136" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><circle cx="231" cy="136" r="10" class="badge"/><text x="231" y="140" font-size="11.5" font-weight="700" text-anchor="middle" class="badge-t">1</text><path d="M274 176 L196 176" class="ln-hl" stroke-width="2" stroke-linejoin="round" marker-end="url(#mh)"/><circle cx="231" cy="176" r="10" class="badge"/><text x="231" y="180" font-size="11.5" font-weight="700" text-anchor="middle" class="badge-t">5</text><path d="M466 136 L576 136" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><circle cx="522" cy="136" r="10" class="badge"/><text x="522" y="140" font-size="11.5" font-weight="700" text-anchor="middle" class="badge-t">2</text><path d="M580 176 L470 176" class="ln-dash" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#md)"/><text x="525" y="170" font-size="11.5" text-anchor="middle" class="faint">reads</text><path d="M484 252 L576 252" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><circle cx="530" cy="252" r="10" class="badge"/><text x="530" y="256" font-size="11.5" font-weight="700" text-anchor="middle" class="badge-t">3</text><path d="M694 306 L694 363 L488 363" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><circle cx="694" cy="334" r="10" class="badge"/><text x="694" y="338" font-size="11.5" font-weight="700" text-anchor="middle" class="badge-t">4</text><path d="M370 392 L370 424 L826 424 L826 150 L812 150" class="ln-dash" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#md)"/><text x="600" y="416" font-size="11.5" text-anchor="middle" class="faint">writes progress, then the result</text><line x1="28" y1="450" x2="812" y2="450" class="rule" stroke-width="1"/><circle cx="37" cy="476" r="9" class="badge"/><text x="37" y="480" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">1</text><text x="53" y="480.5" font-size="12.5" class="mute">start: generate_report returns a taskId at once</text><circle cx="37" cy="500" r="9" class="badge"/><text x="37" y="504" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">2</text><text x="53" y="504.5" font-size="12.5" class="mute">the task is recorded in Redis</text><circle cx="37" cy="524" r="9" class="badge"/><text x="37" y="528" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">3</text><text x="53" y="528.5" font-size="12.5" class="mute">the work is dispatched</text><circle cx="437" cy="476" r="9" class="badge"/><text x="437" y="480" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">4</text><text x="453" y="480.5" font-size="12.5" class="mute">delivered to /api/execute, with retries</text><circle cx="437" cy="500" r="9" class="badge"/><text x="437" y="504" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">5</text><text x="453" y="504.5" font-size="12.5" class="mute">task_status returns progress and the result</text>
