<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"><title>How Upstash Redis and QStash power long-running MCP tools</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
  </defs>
  <rect width="900" height="440" fill="#f8fafc" rx="12"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">@upstash/mcp-toolkit/tasks: the same idea as plain tools</text>

    <rect x="40" y="150" width="170" height="90" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="125" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">Model</text>
    <text x="125" y="205" text-anchor="middle" font-size="11.5" fill="#3730a3">any MCP client:</text>
    <text x="125" y="221" text-anchor="middle" font-size="11.5" fill="#3730a3">Claude Code, Codex, …</text>

    <rect x="300" y="110" width="220" height="170" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="410" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Your MCP server</text>
    <rect x="318" y="152" width="184" height="30" rx="6" fill="#ffffff" stroke="#10b981"/>
    <text x="410" y="172" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#065f46">generate_report</text>
    <rect x="318" y="190" width="184" height="30" rx="6" fill="#ffffff" stroke="#10b981"/>
    <text x="410" y="210" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#065f46">task_status</text>
    <rect x="318" y="228" width="184" height="30" rx="6" fill="#ffffff" stroke="#10b981"/>
    <text x="410" y="248" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#065f46">task_cancel</text>

    <rect x="640" y="80" width="210" height="80" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="745" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Upstash Redis</text>
    <text x="745" y="134" text-anchor="middle" font-size="11.5" fill="#991b1b">task record: status, progress, result</text>

    <rect x="640" y="230" width="210" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="745" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">QStash / Workflow</text>
    <text x="745" y="282" text-anchor="middle" font-size="11.5" fill="#92400e">delivers the work, retries it</text>

    <rect x="300" y="340" width="220" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="410" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">/api/execute</text>
    <text x="410" y="384" text-anchor="middle" font-size="11.5" fill="#334155">runs your handler</text>

    <line x1="210" y1="180" x2="314" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="255" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">1</text>
    <line x1="314" y1="214" x2="214" y2="214" stroke="#059669" stroke-width="2.5" marker-end="url(#g)"/>
    <text x="262" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">5</text>

    <line x1="520" y1="160" x2="636" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="575" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">2</text>
    <line x1="520" y1="185" x2="636" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="566" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">3</text>
    <line x1="660" y1="310" x2="524" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="600" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">4</text>
    <polyline points="520,385 875,385 875,120 856,120" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <text x="700" y="377" text-anchor="middle" font-size="11" fill="#64748b">writes progress, then the result</text>

    <text x="450" y="425" text-anchor="middle" font-size="12" fill="#475569">1 start → taskId at once · 2 record in Redis · 3 dispatch · 4 delivered, with retries · 5 task_status returns the result</text>
  </g>
</svg>
