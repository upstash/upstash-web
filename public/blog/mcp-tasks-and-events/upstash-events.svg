<text x="28" y="34" font-size="15.5" font-weight="650" class="ink">@upstash/mcp-toolkit/events</text><text x="28" y="54" font-size="13" class="mute">Redis keeps the subscriptions, QStash delivers every event.</text><rect x="28" y="112" width="164" height="96" rx="10" class="f-host" stroke-width="1.25"/><text x="110" y="148" font-size="14" font-weight="650" text-anchor="middle" class="t-host">ChatGPT</text><text x="110" y="165" font-size="12" text-anchor="middle" class="s-host">the host: subscribes,</text><text x="110" y="182" font-size="12" text-anchor="middle" class="s-host">wakes on a webhook</text><rect x="256" y="80" width="236" height="300" rx="10" class="f-srv" stroke-width="1.25"/><text x="374" y="104" font-size="14" font-weight="650" text-anchor="middle" class="t-srv">Your MCP server</text><rect x="272" y="121" width="204" height="30" rx="7" class="f-chip" stroke-width="1"/><text x="374" y="140.5" font-size="12.5" text-anchor="middle" class="t-chip mono">events/subscribe</text><rect x="272" y="202" width="204" height="30" rx="7" class="f-chip" stroke-width="1"/><text x="374" y="221.5" font-size="12.5" text-anchor="middle" class="t-chip mono">commentCreated.emit()</text><text x="374" y="250" font-size="11.5" text-anchor="middle" class="s-srv">called when something happens</text><rect x="272" y="296" width="204" height="30" rx="7" class="f-chip" stroke-width="1"/><text x="374" y="315.5" font-size="12.5" text-anchor="middle" class="t-chip mono">/api/events</text><text x="374" y="344" font-size="11.5" text-anchor="middle" class="s-srv">re-checks authorize, signs</text><text x="374" y="360" font-size="11.5" text-anchor="middle" class="s-srv">each attempt with the host's secret</text><rect x="588" y="104" width="224" height="140" rx="10" class="f-redis" stroke-width="1.25"/><text x="700" y="153.5" font-size="14" font-weight="650" text-anchor="middle" class="t-redis">Upstash Redis</text><text x="700" y="170.5" font-size="12" text-anchor="middle" class="s-redis">subscriptions:</text><text x="700" y="187.5" font-size="12" text-anchor="middle" class="s-redis">callback URL,</text><text x="700" y="204.5" font-size="12" text-anchor="middle" class="s-redis">encrypted secret, expiry</text><rect x="588" y="272" width="224" height="84" rx="10" class="f-qs" stroke-width="1.25"/><text x="700" y="302" font-size="14" font-weight="650" text-anchor="middle" class="t-qs">QStash</text><text x="700" y="319" font-size="11.5" text-anchor="middle" class="s-qs">one message per subscription,</text><text x="700" y="336" font-size="11.5" text-anchor="middle" class="s-qs">retried with backoff</text><path d="M192 136 L268 136" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><circle cx="230" cy="136" r="10" class="badge"/><text x="230" y="140" font-size="11.5" font-weight="700" text-anchor="middle" class="badge-t">1</text><path d="M476 136 L584 136" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><circle cx="530" cy="136" r="10" class="badge"/><text x="530" y="140" font-size="11.5" font-weight="700" text-anchor="middle" class="badge-t">2</text><path d="M476 211 L584 211" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><circle cx="552" cy="211" r="10" class="badge"/><text x="552" y="215" font-size="11.5" font-weight="700" text-anchor="middle" class="badge-t">3</text><path d="M476 224 L520 224 L520 290 L584 290" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><circle cx="520" cy="257" r="10" class="badge"/><text x="520" y="261" font-size="11.5" font-weight="700" text-anchor="middle" class="badge-t">4</text><path d="M588 311 L480 311" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><circle cx="536" cy="311" r="10" class="badge"/><text x="536" y="315" font-size="11.5" font-weight="700" text-anchor="middle" class="badge-t">5</text><path d="M272 318 L110 318 L110 212" class="ln-hl" stroke-width="2" stroke-linejoin="round" marker-end="url(#mh)"/><circle cx="110" cy="268" r="10" class="badge"/><text x="110" y="272" font-size="11.5" font-weight="700" text-anchor="middle" class="badge-t">6</text><text x="124" y="300" font-size="12" font-weight="650" class="hl">signed webhook</text><text x="28" y="404" font-size="11.5" class="faint">Host replies: 410 deletes the subscription · 413 drops the event · other errors are retried</text><line x1="28" y1="426" x2="812" y2="426" class="rule" stroke-width="1"/><circle cx="37" cy="452" r="9" class="badge"/><text x="37" y="456" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">1</text><text x="53" y="456.5" font-size="12.5" class="mute">the host subscribes</text><circle cx="37" cy="476" r="9" class="badge"/><text x="37" y="480" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">2</text><text x="53" y="480.5" font-size="12.5" class="mute">the subscription is stored</text><circle cx="37" cy="500" r="9" class="badge"/><text x="37" y="504" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">3</text><text x="53" y="504.5" font-size="12.5" class="mute">emit finds the matching subscriptions</text><circle cx="437" cy="452" r="9" class="badge"/><text x="437" y="456" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">4</text><text x="453" y="456.5" font-size="12.5" class="mute">one QStash message per subscription</text><circle cx="437" cy="476" r="9" class="badge"/><text x="437" y="480" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">5</text><text x="453" y="480.5" font-size="12.5" class="mute">delivered to /api/events, with retries</text><circle cx="437" cy="500" r="9" class="badge"/><text x="437" y="504" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">6</text><text x="453" y="504.5" font-size="12.5" class="mute">the signed POST wakes the agent</text>
