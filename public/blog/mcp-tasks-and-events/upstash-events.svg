<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
  </defs>
  <rect width="900" height="450" fill="#f8fafc" rx="12"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">@upstash/mcp-toolkit/events: Redis keeps subscriptions, QStash delivers</text>

    <rect x="40" y="110" width="170" height="100" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="125" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">ChatGPT</text>
    <text x="125" y="168" text-anchor="middle" font-size="11.5" fill="#3730a3">the host: subscribes,</text>
    <text x="125" y="184" text-anchor="middle" font-size="11.5" fill="#3730a3">wakes on a webhook</text>

    <rect x="290" y="80" width="250" height="290" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="415" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Your MCP server</text>
    <rect x="308" y="120" width="214" height="34" rx="6" fill="#ffffff" stroke="#10b981"/>
    <text x="415" y="142" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#065f46">events/subscribe</text>
    <rect x="308" y="200" width="214" height="34" rx="6" fill="#ffffff" stroke="#10b981"/>
    <text x="415" y="222" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#065f46">commentCreated.emit()</text>
    <text x="415" y="250" text-anchor="middle" font-size="11" fill="#065f46">called when something happens</text>
    <rect x="308" y="300" width="214" height="34" rx="6" fill="#ffffff" stroke="#10b981"/>
    <text x="415" y="322" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#065f46">/api/events</text>
    <text x="415" y="354" text-anchor="middle" font-size="11" fill="#065f46">signs each attempt with the host's secret</text>

    <rect x="650" y="90" width="220" height="90" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="760" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Upstash Redis</text>
    <text x="760" y="143" text-anchor="middle" font-size="11.5" fill="#991b1b">subscriptions: callback URL,</text>
    <text x="760" y="159" text-anchor="middle" font-size="11.5" fill="#991b1b">encrypted secret, expiry</text>

    <rect x="650" y="270" width="220" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="760" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">QStash</text>
    <text x="760" y="323" text-anchor="middle" font-size="11.5" fill="#92400e">one message per subscription,</text>
    <text x="760" y="339" text-anchor="middle" font-size="11.5" fill="#92400e">retried with backoff</text>

    <line x1="210" y1="137" x2="304" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="257" y="128" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">1 subscribe</text>

    <line x1="522" y1="137" x2="646" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="585" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">2 store</text>

    <line x1="522" y1="210" x2="646" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="604" y="205" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">3 find matches</text>

    <line x1="522" y1="226" x2="646" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="566" y="276" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">4 publish</text>

    <line x1="646" y1="335" x2="526" y2="317" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="588" y="345" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">5 deliver</text>

    <polyline points="308,317 125,317 125,214" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#g)"/>
    <text x="215" y="308" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">6 signed webhook</text>

    <text x="760" y="382" text-anchor="middle" font-size="11" fill="#64748b">host answers non-2xx: retried · 410: deleted</text>

    <text x="450" y="432" text-anchor="middle" font-size="12" fill="#475569">1 subscribe · 2 store · 3 emit finds matches · 4 one message each · 5 deliver, with retries · 6 signed POST wakes the agent</text>
  </g>
</svg>
