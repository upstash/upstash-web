<svg xmlns="http://www.w3.org/2000/svg" width="360" height="638" viewBox="0 0 360 638" role="img" aria-labelledby="t d">
<title id="t">MCP Events: the host subscribes, the server posts signed events to its callback</title>
<desc id="d">Sequence diagram with three participants: the agent host (ChatGPT), the MCP server and your app. Subscribe once: the host calls events/subscribe with the event, filters, a callback URL and a secret. The server sends a signed challenge to the callback, which the host echoes back, then returns an id and refreshBefore, and stores the subscription. Every time something happens, for example a new comment in your app, the server POSTs a signed event to the callback, and the agent wakes and acts on the user's instructions.</desc>
<style>text{font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif}.mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.bg{fill:#ffffff;stroke:#e4e4e7}.ink{fill:#022c22}.mute{fill:#52525b}.faint{fill:#71717a}.ln{stroke:#71717a;fill:none}.ln-hl{stroke:#059669;fill:none}.ln-dash{stroke:#a1a1aa;fill:none;stroke-dasharray:5 4}.ah{fill:#71717a}.ah-hl{fill:#059669}.ah-dash{fill:#a1a1aa}.life{stroke:#d4d4d8;stroke-dasharray:4 5}.hl{fill:#047857}.badge{fill:#059669}.badge-t{fill:#ffffff}.frag{fill:none;stroke:#d4d4d8}.frag-tab{fill:#f4f4f5;stroke:#d4d4d8}.act{fill:#fde68a;stroke:#f59e0b}.act-t{fill:#92400e}.rule{stroke:#e4e4e7}.f-host{fill:#eef2ff;stroke:#a5b4fc}.t-host{fill:#3730a3}.s-host{fill:#4338ca}.f-srv{fill:#ecfdf5;stroke:#6ee7b7}.t-srv{fill:#065f46}.s-srv{fill:#047857}.f-redis{fill:#fff1f2;stroke:#fda4af}.t-redis{fill:#9f1239}.s-redis{fill:#be123c}.f-qs{fill:#fffbeb;stroke:#fcd34d}.t-qs{fill:#92400e}.s-qs{fill:#b45309}.f-app{fill:#f4f4f5;stroke:#d4d4d8}.t-app{fill:#27272a}.s-app{fill:#52525b}.f-chip{fill:#ffffff;stroke:#a7f3d0}.t-chip{fill:#065f46}.s-chip{fill:#047857}.f-wake{fill:#ecfdf5;stroke:#34d399}.t-wake{fill:#065f46}.s-wake{fill:#047857}@media (prefers-color-scheme: dark){.bg{fill:#111113;stroke:#27272a}.ink{fill:#ecfdf5}.mute{fill:#a1a1aa}.faint{fill:#8b8b94}.ln{stroke:#a1a1aa}.ln-hl{stroke:#34d399}.ln-dash{stroke:#71717a}.ah{fill:#a1a1aa}.ah-hl{fill:#34d399}.ah-dash{fill:#71717a}.life{stroke:#3f3f46}.hl{fill:#6ee7b7}.badge{fill:#34d399}.badge-t{fill:#022c22}.frag{stroke:#3f3f46}.frag-tab{fill:#18181b;stroke:#3f3f46}.act{fill:rgba(245,158,11,.22);stroke:rgba(251,191,36,.7)}.act-t{fill:#fcd34d}.rule{stroke:#27272a}.f-host{fill:rgba(99,102,241,.14);stroke:rgba(129,140,248,.55)}.t-host{fill:#c7d2fe}.s-host{fill:#a5b4fc}.f-srv{fill:rgba(16,185,129,.09);stroke:rgba(52,211,153,.45)}.t-srv{fill:#a7f3d0}.s-srv{fill:#6ee7b7}.f-redis{fill:rgba(244,63,94,.10);stroke:rgba(251,113,133,.5)}.t-redis{fill:#fecdd3}.s-redis{fill:#fda4af}.f-qs{fill:rgba(245,158,11,.10);stroke:rgba(251,191,36,.5)}.t-qs{fill:#fde68a}.s-qs{fill:#fcd34d}.f-app{fill:rgba(255,255,255,.04);stroke:rgba(255,255,255,.2)}.t-app{fill:#e4e4e7}.s-app{fill:#a1a1aa}.f-chip{fill:rgba(9,9,11,.55);stroke:rgba(52,211,153,.35)}.t-chip{fill:#d1fae5}.s-chip{fill:#6ee7b7}.f-wake{fill:rgba(16,185,129,.16);stroke:rgba(52,211,153,.6)}.t-wake{fill:#a7f3d0}.s-wake{fill:#6ee7b7}}</style>
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" class="ah"/></marker>
<marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" class="ah-hl"/></marker>
<marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" class="ah-dash"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="359" height="637" rx="12"/>
<text x="18" y="34" font-size="15" font-weight="650" class="ink">MCP Events</text><text x="18" y="54" font-size="13" class="mute">The server wakes the agent.</text><rect x="10" y="78" width="96" height="44" rx="10" class="f-host" stroke-width="1.25"/><text x="58" y="96.75" font-size="12.5" font-weight="650" text-anchor="middle" class="t-host">Agent host</text><text x="58" y="111.75" font-size="11" text-anchor="middle" class="s-host">(ChatGPT)</text><rect x="148" y="78" width="96" height="44" rx="10" class="f-srv" stroke-width="1.25"/><text x="196" y="104.25" font-size="12.5" font-weight="650" text-anchor="middle" class="t-srv">MCP server</text><rect x="258" y="78" width="96" height="44" rx="10" class="f-app" stroke-width="1.25"/><text x="306" y="104.25" font-size="12.5" font-weight="650" text-anchor="middle" class="t-app">Your app</text><line x1="58" y1="122" x2="58" y2="574" class="life" stroke-width="1.5"/><line x1="196" y1="122" x2="196" y2="574" class="life" stroke-width="1.5"/><line x1="306" y1="122" x2="306" y2="574" class="life" stroke-width="1.5"/><text x="16" y="148" font-size="10" font-weight="650" letter-spacing="0.08em" class="faint">SUBSCRIBE ONCE</text><line x1="122" y1="144" x2="346" y2="144" class="rule" stroke-width="1"/><path d="M64 206 L190 206" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="127" y="171" font-size="11" font-weight="500" text-anchor="middle" class="ink mono">events/subscribe</text><text x="127" y="184.5" font-size="10.5" text-anchor="middle" class="mute">event, filters,</text><text x="127" y="198" font-size="10.5" text-anchor="middle" class="mute">callback URL, secret</text><path d="M190 248 L64 248" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="127" y="240" font-size="11" font-weight="500" text-anchor="middle" class="ink">signed challenge</text><path d="M64 284 L190 284" class="ln-dash" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#md)"/><text x="127" y="276" font-size="11" font-weight="500" text-anchor="middle" class="mute">echoed back</text><path d="M190 330 L64 330" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="127" y="322" font-size="11" font-weight="500" text-anchor="middle" class="ink mono">{ id, refreshBefore }</text><rect x="144" y="352" width="104" height="26" rx="6" class="f-app" stroke-width="1" stroke-dasharray="3 3"/><text x="196" y="369" font-size="11" font-weight="600" text-anchor="middle" class="t-app">subscription stored</text><text x="16" y="408" font-size="10" font-weight="650" letter-spacing="0.08em" class="faint">EVERY TIME IT HAPPENS</text><line x1="164" y1="404" x2="346" y2="404" class="rule" stroke-width="1"/><path d="M300 452 L202 452" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="251" y="430.5" font-size="11" font-weight="500" text-anchor="middle" class="ink">something</text><text x="251" y="444" font-size="10.5" text-anchor="middle" class="mute">happens</text><path d="M190 500 L64 500" class="ln-hl" stroke-width="2" stroke-linejoin="round" marker-end="url(#mh)"/><text x="127" y="478.5" font-size="11" font-weight="650" text-anchor="middle" class="hl mono">POST callback</text><text x="127" y="492" font-size="10.5" text-anchor="middle" class="mute">signed event</text><rect x="14" y="526" width="156" height="44" rx="10" class="f-wake" stroke-width="1.25"/><text x="92" y="544.75" font-size="11.5" font-weight="650" text-anchor="middle" class="t-wake">agent wakes and acts</text><text x="92" y="558.75" font-size="10.5" text-anchor="middle" class="s-wake">on your instructions</text><text x="18" y="604" font-size="12" class="mute">No cron, no polling, no one typing a message.</text><text x="18" y="621" font-size="12" class="mute">The host refreshes the subscription before it expires.</text>
</svg>
