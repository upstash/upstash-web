<svg xmlns="http://www.w3.org/2000/svg" width="360" height="642" viewBox="0 0 360 642" role="img" aria-labelledby="t d">
<title id="t">How Upstash Redis and QStash power long-running MCP tools</title>
<desc id="d">Architecture. 1: the model calls generate_report on your MCP server, which answers at once with a taskId. 2: the server records the task in Upstash Redis. 3: it dispatches the work to QStash or Upstash Workflow. 4: QStash or Workflow delivers it, with retries, to the /api/execute route, which runs your handler and writes progress, then the result, to Redis. 5: task_status reads the record from Redis and returns the result to the model. task_cancel stops a task.</desc>
