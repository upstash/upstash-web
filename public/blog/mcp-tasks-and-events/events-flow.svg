<text x="28" y="34" font-size="15.5" font-weight="650" class="ink">MCP Events</text><text x="28" y="54" font-size="13" class="mute">The server wakes the agent.</text><rect x="52" y="64" width="176" height="38" rx="10" class="f-host" stroke-width="1.25"/><text x="140" y="87.75" font-size="13.5" font-weight="650" text-anchor="middle" class="t-host">Agent host (ChatGPT)</text><rect x="312" y="64" width="176" height="38" rx="10" class="f-srv" stroke-width="1.25"/><text x="400" y="87.75" font-size="13.5" font-weight="650" text-anchor="middle" class="t-srv">MCP server</text><rect x="552" y="64" width="176" height="38" rx="10" class="f-app" stroke-width="1.25"/><text x="640" y="87.75" font-size="13.5" font-weight="650" text-anchor="middle" class="t-app">Your app</text><line x1="140" y1="102" x2="140" y2="516" class="life" stroke-width="1.5"/><line x1="400" y1="102" x2="400" y2="516" class="life" stroke-width="1.5"/><line x1="640" y1="102" x2="640" y2="516" class="life" stroke-width="1.5"/><text x="26" y="130" font-size="10.5" font-weight="650" letter-spacing="0.08em" class="faint">SUBSCRIBE ONCE</text><line x1="146" y1="126" x2="736" y2="126" class="rule" stroke-width="1"/><path d="M146 182 L394 182" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="270" y="159.5" font-size="12.5" font-weight="500" text-anchor="middle" class="ink mono">events/subscribe</text><text x="270" y="174" font-size="11.5" text-anchor="middle" class="mute">event, filters, callback URL, secret</text><path d="M394 222 L146 222" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="270" y="214" font-size="12.5" font-weight="500" text-anchor="middle" class="ink">signed challenge</text><path d="M146 256 L394 256" class="ln-dash" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#md)"/><text x="270" y="248" font-size="12.5" font-weight="500" text-anchor="middle" class="mute">echoed back</text><path d="M394 298 L146 298" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="270" y="290" font-size="12.5" font-weight="500" text-anchor="middle" class="ink mono">{ id, refreshBefore }</text><rect x="325" y="316" width="150" height="26" rx="6" class="f-app" stroke-width="1" stroke-dasharray="3 3"/><text x="400" y="333" font-size="12" font-weight="600" text-anchor="middle" class="t-app">subscription stored</text><text x="26" y="370" font-size="10.5" font-weight="650" letter-spacing="0.08em" class="faint">EVERY TIME SOMETHING HAPPENS</text><line x1="238" y1="366" x2="736" y2="366" class="rule" stroke-width="1"/><path d="M634 410 L406 410" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><text x="520" y="387.5" font-size="12.5" font-weight="500" text-anchor="middle" class="ink">something happens</text><text x="520" y="402" font-size="11.5" text-anchor="middle" class="mute">e.g. a new comment</text><path d="M394 452 L146 452" class="ln-hl" stroke-width="2" stroke-linejoin="round" marker-end="url(#mh)"/><text x="270" y="429.5" font-size="12.5" font-weight="650" text-anchor="middle" class="hl mono">POST callback</text><text x="270" y="444" font-size="11.5" text-anchor="middle" class="mute">signed event</text><rect x="52" y="474" width="176" height="40" rx="10" class="f-wake" stroke-width="1.25"/><text x="140" y="490.75" font-size="12.5" font-weight="650" text-anchor="middle" class="t-wake">agent wakes and acts</text><text x="140" y="505.75" font-size="11.5" text-anchor="middle" class="s-wake">on the user's instructions</text><text x="28" y="546" font-size="12.5" class="mute">No cron, no polling, no one typing a message. The subscription is refreshed before it expires.</text>
</svg>
