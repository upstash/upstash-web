edis{fill:#fecdd3}.s-redis{fill:#fda4af}.f-qs{fill:rgba(245,158,11,.10);stroke:rgba(251,191,36,.5)}.t-qs{fill:#fde68a}.s-qs{fill:#fcd34d}.f-app{fill:rgba(255,255,255,.04);stroke:rgba(255,255,255,.2)}.t-app{fill:#e4e4e7}.s-app{fill:#a1a1aa}.f-chip{fill:rgba(9,9,11,.55);stroke:rgba(52,211,153,.35)}.t-chip{fill:#d1fae5}.s-chip{fill:#6ee7b7}.f-wake{fill:rgba(16,185,129,.16);stroke:rgba(52,211,153,.6)}.t-wake{fill:#a7f3d0}.s-wake{fill:#6ee7b7}}</style>
