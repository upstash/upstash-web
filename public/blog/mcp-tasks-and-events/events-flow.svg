<svg xmlns="http://www.w3.org/2000/svg" width="760" height="572" viewBox="0 0 760 572" role="img" aria-labelledby="t d">
<title id="t">MCP Events: the host subscribes, the server posts signed events to its callback</title>
<desc id="d">Sequence diagram with three participants: the agent host (ChatGPT), the MCP server and your app. Subscribe once: the host calls events/subscribe with the event, filters, a callback URL and a secret. The server sends a signed challenge to the callback, which the host echoes back, then returns an id and refreshBefore, and stores the subscription. Every time something happens, for example a new comment in your app, the server POSTs a signed event to the callback, and the agent wakes and acts on the user's instructions.</desc>
