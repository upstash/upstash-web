<text x="18" y="34" font-size="14.5" font-weight="650" class="ink">@upstash/mcp-toolkit/events</text><text x="18" y="54" font-size="12" class="mute">Redis keeps subscriptions, QStash delivers.</text><rect x="30" y="70" width="312" height="50" rx="10" class="f-host" stroke-width="1.25"/><text x="186" y="91" font-size="13" font-weight="650" text-anchor="middle" class="t-host">ChatGPT</text><text x="186" y="108" font-size="11.5" text-anchor="middle" class="s-host">the host: subscribes, wakes on a webhook</text><rect x="30" y="164" width="180" height="254" rx="10" class="f-srv" stroke-width="1.25"/><text x="120" y="184" font-size="12.5" font-weight="650" text-anchor="middle" class="t-srv">Your MCP server</text><rect x="40" y="196" width="160" height="28" rx="7" class="f-chip" stroke-width="1"/><text x="120" y="213.96" font-size="11" text-anchor="middle" class="t-chip mono">events/subscribe</text><rect x="40" y="254" width="160" height="28" rx="7" class="f-chip" stroke-width="1"/><text x="120" y="271.78" font-size="10.5" text-anchor="middle" class="t-chip mono">commentCreated.emit()</text><text x="120" y="298" font-size="10.5" text-anchor="middle" class="s-srv">when something happens</text><rect x="40" y="338" width="160" height="28" rx="7" class="f-chip" stroke-width="1"/><text x="120" y="355.96" font-size="11" text-anchor="middle" class="t-chip mono">/api/events</text><text x="120" y="384" font-size="10.5" text-anchor="middle" class="s-srv">re-checks authorize,</text><text x="120" y="398" font-size="10.5" text-anchor="middle" class="s-srv">signs each attempt</text><rect x="244" y="172" width="98" height="120" rx="10" class="f-redis" stroke-width="1.25"/><text x="293" y="208.25" font-size="12.5" font-weight="650" text-anchor="middle" class="t-redis">Redis</text><text x="293" y="222.25" font-size="10.5" text-anchor="middle" class="s-redis">subscriptions:</text><text x="293" y="236.25" font-size="10.5" text-anchor="middle" class="s-redis">callback URL,</text><text x="293" y="250.25" font-size="10.5" text-anchor="middle" class="s-redis">encrypted</text><text x="293" y="264.25" font-size="10.5" text-anchor="middle" class="s-redis">secret, expiry</text><rect x="244" y="312" width="98" height="76" rx="10" class="f-qs" stroke-width="1.25"/><text x="293" y="340.25" font-size="12.5" font-weight="650" text-anchor="middle" class="t-qs">QStash</text><text x="293" y="354.25" font-size="10.5" text-anchor="middle" class="s-qs">one message</text><text x="293" y="368.25" font-size="10.5" text-anchor="middle" class="s-qs">each, retried</text><path d="M120 120 L120 192" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><circle cx="120" cy="146" r="10" class="badge"/><text x="120" y="150" font-size="11.5" font-weight="700" text-anchor="middle" class="badge-t">1</text><path d="M200 210 L240 210" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><circle cx="222" cy="210" r="8.5" class="badge"/><text x="222" y="214" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">2</text><path d="M200 262 L240 262" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><circle cx="222" cy="262" r="8.5" class="badge"/><text x="222" y="266" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">3</text><path d="M200 274 L226 274 L226 334 L240 334" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><circle cx="226" cy="312" r="8.5" class="badge"/><text x="226" y="316" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">4</text><path d="M244 360 L204 360" class="ln" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m)"/><circle cx="222" cy="360" r="8.5" class="badge"/><text x="222" y="364" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">5</text><path d="M40 352 L16 352 L16 95 L26 95" class="ln-hl" stroke-width="2" stroke-linejoin="round" marker-end="url(#mh)"/><circle cx="16" cy="230" r="8.5" class="badge"/><text x="16" y="234" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">6</text><text x="18" y="444" font-size="11" class="faint">Host replies: 410 deletes the subscription,</text><text x="18" y="459" font-size="11" class="faint">413 drops the event, other errors are retried.</text><line x1="18" y1="478" x2="342" y2="478" class="rule" stroke-width="1"/><circle cx="27" cy="502" r="9" class="badge"/><text x="27" y="506" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">1</text><text x="43" y="506.5" font-size="12" class="mute">the host subscribes</text><circle cx="27" cy="525" r="9" class="badge"/><text x="27" y="529" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">2</text><text x="43" y="529.5" font-size="12" class="mute">the subscription is stored</text><circle cx="27" cy="548" r="9" class="badge"/><text x="27" y="552" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">3</text><text x="43" y="552.5" font-size="12" class="mute">emit finds the matching subscriptions</text><circle cx="27" cy="571" r="9" class="badge"/><text x="27" y="575" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">4</text><text x="43" y="575.5" font-size="12" class="mute">one QStash message per subscription</text><circle cx="27" cy="594" r="9" class="badge"/><text x="27" y="598" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">5</text><text x="43" y="598.5" font-size="12" class="mute">delivered to /api/events, with retries</text><circle cx="27" cy="617" r="9" class="badge"/><text x="27" y="621" font-size="10.5" font-weight="700" text-anchor="middle" class="badge-t">6</text><text x="43" y="621.5" font-size="12" class="mute">the signed POST wakes the agent</text>
