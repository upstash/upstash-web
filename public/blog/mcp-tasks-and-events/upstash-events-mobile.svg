<svg xmlns="http://www.w3.org/2000/svg" width="360" height="636" viewBox="0 0 360 636" role="img" aria-labelledby="t d">
<title id="t">How Upstash Redis and QStash power MCP Events</title>
<desc id="d">Architecture. 1: ChatGPT subscribes through events/subscribe on your MCP server. 2: the server stores the subscription (callback URL, encrypted secret, expiry) in Upstash Redis. 3: when something happens, commentCreated.emit() finds the matching subscriptions in Redis. 4: it publishes one QStash message per subscription. 5: QStash delivers each one to the server's /api/events route, retrying with backoff. 6: the route signs each attempt with the host's secret and POSTs the webhook to ChatGPT, which wakes the agent. A 410 from the host deletes the subscription, a 413 drops the event, other errors are retried.</desc>
