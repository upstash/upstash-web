<svg xmlns="http://www.w3.org/2000/svg" width="640" height="246" viewBox="0 0 640 246" role="img" aria-labelledby="t d"><title id="t">Did the assistant paste the attacker's command?</title><desc id="d">With raw documentation the assistant reproduced the command in 9 of 48 runs. Through Context7, 0 of 48.</desc><rect width="640" height="246" fill="#faf9f6"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="50" font-size="21" fill="#202426" font-weight="700">Did the assistant paste the attacker's command?</text><text x="32" y="80" font-size="16" fill="#667075">Real pages carrying an attacker-shaped install command</text><circle cx="40" cy="108" r="7" fill="#8b9398"/><text x="56" y="114" font-size="17" fill="#202426">Raw documentation</text><circle cx="222.39999999999998" cy="108" r="7" fill="#ea580c"/><text x="238.39999999999998" y="114" font-size="17" fill="#202426">Through Context7</text><text x="32" y="148" font-size="18" fill="#202426" font-weight="700">Answers containing the command</text><rect x="32" y="162" width="372" height="22" rx="4" fill="#e9e7e1"/><rect x="32" y="162" width="70" height="22" rx="4" fill="#8b9398"/><text x="422" y="179" font-size="19" font-weight="700" fill="#202426">9</text><text x="440" y="179" font-size="15" fill="#667075">of 48</text><rect x="32" y="192" width="372" height="22" rx="4" fill="#e9e7e1"/><rect x="32" y="192" width="4" height="22" rx="2" fill="#ea580c"/><text x="422" y="209" font-size="19" font-weight="700" fill="#ea580c">0</text><text x="440" y="209" font-size="15" fill="#667075">of 48</text></g></svg>