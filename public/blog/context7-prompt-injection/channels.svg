<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="t d"><title id="t">Which layers pass the injection through?</title><desc id="d">A plain HTTP fetch delivered the injected text on 7 of 7 reachable pages, Exa contents on 7 of 7, Context7 on 0 of 8.</desc><rect width="640" height="340" fill="#faf9f6"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="50" font-size="25" fill="#202426" font-weight="700">Which layers pass the injection through?</text><text x="32" y="80" font-size="16" fill="#667075">8 real pages, each requested by its exact URL · no search involved</text><circle cx="40" cy="108" r="7" fill="#8b9398"/><text x="56" y="114" font-size="17" fill="#202426">Fetch layer</text><circle cx="167.2" cy="108" r="7" fill="#ea580c"/><text x="183.2" y="114" font-size="17" fill="#202426">Context7</text><text x="32" y="148" font-size="18" fill="#202426" font-weight="700">Plain HTTP fetch</text><text x="197.6" y="148" font-size="15" fill="#667075">pages delivered with the injection intact</text><rect x="32" y="162" width="372" height="22" rx="4" fill="#e9e7e1"/><rect x="32" y="162" width="326" height="22" rx="4" fill="#8b9398"/><text x="422" y="179" font-size="19" font-weight="700" fill="#202426">7</text><text x="440" y="179" font-size="15" fill="#667075">of 7</text><text x="32" y="210" font-size="18" fill="#202426" font-weight="700">Exa /contents</text><text x="168.8" y="210" font-size="15" fill="#667075">same pages, same URLs</text><rect x="32" y="224" width="372" height="22" rx="4" fill="#e9e7e1"/><rect x="32" y="224" width="326" height="22" rx="4" fill="#8b9398"/><text x="422" y="241" font-size="19" font-weight="700" fill="#202426">7</text><text x="440" y="241" font-size="15" fill="#667075">of 7</text><text x="32" y="272" font-size="18" fill="#202426" font-weight="700">Context7</text><text x="120.8" y="272" font-size="15" fill="#667075">same pages, same URLs</text><rect x="32" y="286" width="372" height="22" rx="4" fill="#e9e7e1"/><rect x="32" y="286" width="4" height="22" rx="2" fill="#ea580c"/><text x="422" y="303" font-size="19" font-weight="700" fill="#ea580c">0</text><text x="440" y="303" font-size="15" fill="#667075">of 8</text></g></svg>