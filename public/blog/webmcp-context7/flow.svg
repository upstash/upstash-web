<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title description">
  <title id="title">WebMCP and Context7 documentation flow</title>
  <desc id="description">A browser agent sends a question to a WebMCP tool, which retrieves current library documentation from Context7.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101311" />
      <stop offset="1" stop-color="#171c19" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.24" />
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#65d99b" />
    </marker>
  </defs>

  <rect width="1400" height="520" rx="36" fill="url(#background)" />

  <g filter="url(#shadow)">
    <rect x="80" y="130" width="340" height="260" rx="24" fill="#1d221f" stroke="#39433d" stroke-width="2" />
    <rect x="530" y="130" width="340" height="260" rx="24" fill="#1d221f" stroke="#4d7d61" stroke-width="2" />
    <rect x="980" y="130" width="340" height="260" rx="24" fill="#1d221f" stroke="#39433d" stroke-width="2" />
  </g>

  <g fill="none" stroke="#65d99b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 440 260 H 495" />
    <path d="M 890 260 H 945" />
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(250 220)">
      <rect x="-70" y="-54" width="140" height="92" rx="14" fill="#252c28" stroke="#76827a" stroke-width="2" />
      <circle cx="-48" cy="-32" r="5" fill="#65d99b" />
      <circle cx="-30" cy="-32" r="5" fill="#76827a" />
      <path d="M -48 -8 H 48 M -48 10 H 20" stroke="#76827a" stroke-width="7" stroke-linecap="round" />
      <text y="88" fill="#f3f7f4" font-size="30" font-weight="650">Browser Agent</text>
      <text y="124" fill="#aab5ae" font-size="20">Asks a library question</text>
    </g>

    <g transform="translate(700 220)">
      <path d="M -60 0 H 60 M -42 -30 L -68 0 L -42 30 M 42 -30 L 68 0 L 42 30" fill="none" stroke="#65d99b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <text y="88" fill="#f3f7f4" font-size="30" font-weight="650">WebMCP Tool</text>
      <text y="124" fill="#aab5ae" font-size="20">query_library_docs</text>
    </g>

    <g transform="translate(1150 220)">
      <path d="M -66 -36 H 46 L 66 -16 V 48 H -66 Z" fill="#26312b" stroke="#65d99b" stroke-width="3" stroke-linejoin="round" />
      <path d="M 46 -36 V -16 H 66 M -42 -2 H 40 M -42 18 H 24" fill="none" stroke="#91a399" stroke-width="7" stroke-linecap="round" />
      <text y="88" fill="#f3f7f4" font-size="30" font-weight="650">Context7</text>
      <text y="124" fill="#aab5ae" font-size="20">Returns current docs</text>
    </g>
  </g>
</svg>
