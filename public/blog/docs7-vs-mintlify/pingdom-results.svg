<svg xmlns="http://www.w3.org/2000/svg" width="640" height="590" viewBox="0 0 640 590" role="img" aria-labelledby="title desc"><title id="title">How fast did pages load?</title><desc id="desc">San Francisco: Average page load time: Docs7 509.3 ms, Mintlify 651.9 ms. Frankfurt: Average page load time: Docs7 429.6 ms, Mintlify 582.1 ms. Tokyo: Average page load time: Docs7 1247.3 ms, Mintlify 1933.3 ms.</desc><rect width="640" height="590" fill="#faf9f6"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="48" font-size="30" fill="#202426" font-weight="700" text-anchor="start">How fast did pages load?</text><text x="32" y="79" font-size="18" fill="#667075" font-weight="400" text-anchor="start">Pingdom · page load time in milliseconds</text><circle cx="40" cy="116" r="7" fill="#ea580c"/><text x="56" y="123" font-size="20" fill="#202426" font-weight="400" text-anchor="start">Docs7</text><circle cx="174" cy="116" r="7" fill="#18e299"/><text x="190" y="123" font-size="20" fill="#202426" font-weight="400" text-anchor="start">Mintlify</text><image href="data:image/png;base64," x="577" y="24" width="28" height="28"/><text x="32" y="177" font-size="23" fill="#202426" font-weight="700" text-anchor="start">San Francisco</text><rect x="32" y="197" width="450" height="23" fill="#eeede8"/><rect x="32" y="197" width="91.674" height="23" fill="#ea580c"/><text x="608" y="217" font-size="23" fill="#202426" font-weight="700" text-anchor="end">509.3 ms</text><rect x="32" y="232" width="450" height="23" fill="#eeede8"/><rect x="32" y="232" width="117.342" height="23" fill="#18e299"/><text x="608" y="252" font-size="23" fill="#202426" font-weight="700" text-anchor="end">651.9 ms</text><path d="M32 276 H608" stroke="#e6e5df"/><text x="32" y="319" font-size="23" fill="#202426" font-weight="700" text-anchor="start">Frankfurt</text><rect x="32" y="339" width="450" height="23" fill="#eeede8"/><rect x="32" y="339" width="77.328" height="23" fill="#ea580c"/><text x="608" y="359" font-s